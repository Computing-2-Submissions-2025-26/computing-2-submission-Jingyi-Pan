<!DOCTYPE html> 
<html lang="en"> 
<head> 
    <meta charset="UTF-8"> 
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
    <title>Penguin vs Seagull Gomoku By QQJingyiPan</title> 
    <link rel="stylesheet" href="default.css"> 
</head>

<body>
    <audio
        id="bgm" 
        src="assets/bgm.mp3" 
        autoplay
        loop
    ></audio> 

    <main>
        <h1>Penguin vs Seagull</h1>

        <p id="status">Penguin's turn</p>

        <div id="skill-area">
            <button id="remove-button">Remove Opponent Piece</button>
        </div>

        <div id="game-area">
            <div class="player-panel">
                <div class="info-box">
                     <h3>How to Play</h3>
                    <p>Take turns placing pieces on the board. The first player to connect five pieces in a row wins. </p>
                </div>
                <img
                    id="penguin-player"
                    class="side-player active-player"
                    src="assets/penguin.jpg"
                    alt="Penguin player"
                >

                <div class="score-box">
                    <p>Win: <span id="penguin-win">0</span></p>
                    <p>Loss: <span id="penguin-loss">0</span></p>
                    <p>Draw: <span id="penguin-draw">0</span></p>
                </div>
            </div>

            <table id="board"></table>

            <div class="player-panel">
                <div class="info-box">
                    <h3>Ways to Win</h3>
                    <p>Connect five pieces horizontally, vertically, diagonally down, or diagonally up.</p>
                </div>
                <img
                    id="seagull-player"
                    class="side-player"
                    src="assets/seagull.jpg"
                    alt="Seagull player"
                >

                <div class="score-box">
                    <p>Win: <span id="seagull-win">0</span></p>
                    <p>Loss: <span id="seagull-loss">0</span></p>
                    <p>Draw: <span id="seagull-draw">0</span></p>
                </div>
            </div>
        </div>

        <button id="restart-button">Restart</button>

        <div id="video-popup-screen" class="hidden"> 
            <div id="video-popup">
                <button id="close-video-button">&#10005;</button>

                <video
                    id="win-video"
                    src="assets/win.mp4"    
                    playsinline
                ></video>
            </div>
        </div>
    </main>

    <script type="module" src="main.js"></script>
</body>
</html>
