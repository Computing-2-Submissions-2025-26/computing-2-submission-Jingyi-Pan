<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Penguin vs Seagull Gomoku</title>
    <link rel="stylesheet" href="default.css">
</head>
<body>
    <main>
        <h1>Penguin vs Seagull</h1>

        <p id="status">Penguin's turn</p>

        <div id="game-area">
            <img id="penguin-player" class="side-player active-player" src="penguin.jpg">

            <table id="board"></table>

            <img id="seagull-player" class="side-player" src="seagull.jpg">
        </div>

        <button id="restart-button">Restart</button>

        <div id="animation-screen" class="hidden">
            <div id="animation-content"></div>
        </div>
    </main>

    <script src="main.js"></script>
</body>
</html>
